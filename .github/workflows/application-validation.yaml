name: Campus Event Manager Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

  workflow_dispatch:

jobs:
  validate-application:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Display repository files
        run: ls -la

      - name: Display triggering event
        run: echo "Workflow triggered by: ${{ github.event_name }}"

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

